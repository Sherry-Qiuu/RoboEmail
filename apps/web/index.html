<!doctype html>
<html
  lang="zh-CN"
  data-edge-appearance="system"
  data-edge-color-theme="sage"
  data-edge-image-theme="none"
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RoboEmail</title>
    <!-- Edge Fluent appearance: paints the canvas, exposes the --edge-* tokens
         and mounts the appearance panel. Must run before first paint. -->
    <script
      src="/edge-theme.js"
      data-edge-appearance="system"
      data-edge-color-theme="sage"
      data-edge-image-theme="none"
      data-edge-panel="true"
      data-edge-position="bottom-left"
      data-edge-lang="zh"
      data-edge-storage-key="roboemail:appearance"
    ></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
