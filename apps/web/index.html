<!doctype html>
<html
  lang="zh-CN"
  data-edge-appearance="system"
  data-edge-color-theme="sage"
  data-edge-image-theme="none"
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RoboEmail</title>
    <meta name="theme-color" content="#4f7a5b" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#191917" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="UNNC 学生在用的英文邮件写作助手：写给教授的邮件，从提笔到收尾。"
    />
    <link rel="icon" href="/brand/favicon.ico" sizes="any" />
    <link rel="icon" href="/brand/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://rbem.online/" />
    <meta property="og:title" content="RoboEmail · 写给教授的英文邮件" />
    <meta
      property="og:description"
      content="从提笔到收尾：选目的、写背景，拿到一版措辞得体的英式邮件。"
    />
    <meta property="og:image" content="https://rbem.online/brand/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Edge Fluent appearance: paints the canvas, exposes the --edge-* tokens
         and mounts the appearance panel. Must run before first paint. -->
    <script
      src="/edge-theme.js"
      data-edge-appearance="system"
      data-edge-color-theme="sage"
      data-edge-image-theme="none"
      data-edge-panel="true"
      data-edge-position="bottom-left"
      data-edge-lang="zh"
      data-edge-storage-key="roboemail:appearance"
    ></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
