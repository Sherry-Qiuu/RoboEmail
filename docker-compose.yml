services:
  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Overrides whatever .env says for local development.
      NODE_ENV: production
      PORT: 8787
    volumes:
      - ./apps/server/data:/app/apps/server/data
    expose:
      - '8787'

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config:
